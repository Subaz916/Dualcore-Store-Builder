<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Template — DualCore Store Builder</title>
  <meta name="description" content="Pick a starting template for your store. Each template includes pre-built sections tailored to your business type.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C6EFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E">
</head>
<body class="app-page no-splash">
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <main class="app-main">
      <div id="topbarMount"></div>

      <div class="page-head">
        <div>
          <h1>Choose Your Template</h1>
          <p class="muted">Pick a starting design — fully customizable in the builder</p>
        </div>
        <div class="page-actions">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Search templates…" id="templateSearch" aria-label="Search templates">
          </div>
        </div>
      </div>

      <div class="filter-bar" id="templateFilters">
        <button class="chip active" data-cat="all">All</button>
      </div>

      <div class="feature-row stagger" id="templateGrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"></div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/storefront.js"></script>
  <script src="assets/js/template-select.js"></script>
</body>
</html>
