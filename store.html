<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Store — DualCore</title>
  <meta name="description" content="Preview your generated storefront.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C6EFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E">
</head>
<body class="app-page no-splash">
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <main class="app-main">
      <div id="topbarMount"></div>

      <div class="page-head">
        <div>
          <h1>Store preview</h1>
          <p class="muted">This is how your storefront looks to visitors</p>
        </div>
        <div class="page-actions">
          <a href="builder.html" class="btn btn-ghost">✎ Edit design</a>
          <a href="publish.html" class="btn btn-primary">Publish</a>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="flex-between" style="padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)">
          <div class="flex align-center gap-2">
            <span class="badge badge-ghost">Preview mode</span>
            <span class="muted" style="font-size:.85rem" id="storeUrl">—</span>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-ghost btn-sm" id="openNewTab">Open in new tab ↗</button>
          </div>
        </div>
        <div class="chart-box" style="height:calc(100vh - 320px);min-height:480px;background:#fff">
          <div id="storePreview" style="width:100%;height:100%;overflow:auto">
            <div class="flex-center" style="height:100%;color:var(--muted)">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/storefront.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/store.js"></script>
</body>
</html>
