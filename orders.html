<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — DualCore</title>
  <meta name="description" content="Track and manage your store orders, invoices and fulfillment.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C6EFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E">
</head>
<body class="app-page no-splash">
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <main class="app-main">
      <div id="topbarMount"></div>

      <div class="page-head">
        <div>
          <h1>Orders</h1>
          <p class="muted" id="ordersCount">Loading…</p>
        </div>
        <div class="page-actions">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Search orders…" id="orderSearch" aria-label="Search orders">
          </div>
          <button class="btn btn-ghost" id="exportOrders">⤓ Export</button>
        </div>
      </div>

      <div class="filter-bar" id="orderFilters">
        <button class="chip active" data-status="all">All</button>
        <button class="chip" data-status="pending">Pending</button>
        <button class="chip" data-status="paid">Paid</button>
        <button class="chip" data-status="shipped">Shipped</button>
        <button class="chip" data-status="refunded">Refunded</button>
        <button class="chip" data-status="cancelled">Cancelled</button>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
      </div>
      <div class="pagination" id="ordersPagination"></div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/orders.js"></script>
</body>
</html>
