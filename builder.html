<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Builder — DualCore</title>
  <meta name="description" content="Visually design your online store. Drag sections, customize themes, preview on all devices.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/builder.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C6EFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E">
  <style>
    /* ---- Builder-specific overrides ---- */
    .builder-shell {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      height: calc(100vh - 80px);
      overflow: hidden;
      margin: -24px -24px 0;
    }
    .builder-left {
      background: var(--surface, #fff);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .builder-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 8px;
      flex-shrink: 0;
    }
    .builder-tabs .tab {
      flex: 1;
      padding: 12px 4px;
      font-size: .75rem;
      font-weight: 700;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2.5px solid transparent;
      transition: all .2s;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .builder-tabs .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .builder-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .builder-panel.active { display: block; }

    /* ---- Canvas ---- */
    .builder-right {
      display: flex;
      flex-direction: column;
      background: #f1f5f9;
      overflow: hidden;
    }
    .builder-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .builder-toolbar-end {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .builder-canvas-wrap {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .builder-device-frame {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(15,23,42,.15), 0 0 0 1px rgba(0,0,0,.06);
      width: 100%;
      max-width: 1200px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: max-width .3s;
    }
    .builder-device-frame.tablet { max-width: 768px; }
    .builder-device-frame.mobile { max-width: 390px; }
    .builder-device-bar {
      height: 36px;
      background: linear-gradient(180deg, #e2e8f0, #cbd5e1);
      border-bottom: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }
    .builder-device-dots { display: flex; gap: 5px; }
    .builder-device-dots span { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; }
    .builder-device-dots span:nth-child(1) { background: #FC605B; }
    .builder-device-dots span:nth-child(2) { background: #FDBC40; }
    .builder-device-dots span:nth-child(3) { background: #35C749; }
    .builder-device-url {
      flex: 1; text-align: center; font-size: .72rem; color: #64748b;
      background: #fff; padding: 4px 12px; border-radius: 99px;
      font-weight: 600; max-width: 360px; margin: 0 auto;
    }
    #builderCanvas {
      flex: 1;
      min-height: 500px;
      position: relative;
      background: #fff;
    }
    #builderCanvas .canvas-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    #builderCanvas .canvas-empty svg { opacity: .35; margin-bottom: 16px; }
    #builderCanvas .canvas-empty h3 { margin-bottom: 8px; }

    /* ---- Section editor panel ---- */
    .builder-editor {
      display: none;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px;
      max-height: 320px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .builder-editor.open { display: block; }
    .editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .editor-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .editor-field { margin: 0; }
    .editor-field label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .editor-field .input, .editor-field .select, .editor-field .textarea {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--bg); font-size: .87rem;
    }
    .editor-field.full { grid-column: 1 / -1; }
    .editor-field .checkbox { display: flex; align-items: center; gap: 8px; }
    .editor-field .checkbox input { accent-color: var(--primary); }

    /* ---- Section item in canvas (hover tools) ---- */
    #builderCanvas .sf-wrap {
      position: relative;
    }
    #builderCanvas .sf-wrap:hover .sf-section-tools,
    #builderCanvas .sf-wrap.selected .sf-section-tools {
      display: flex !important;
    }
    #builderCanvas .sf-wrap.selected {
      outline: 2.5px solid var(--primary);
      outline-offset: 2px;
    }
    #builderCanvas .sf-wrap.sf-hidden-wrap {
      opacity: .45;
    }
    .sf-section-tools {
      display: none !important;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 50;
      gap: 4px;
      background: rgba(15,23,42,.9);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 5px;
    }
    .sf-section-tools button {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: .9rem;
      cursor: pointer;
      background: transparent;
      border: none;
      transition: background .15s;
    }
    .sf-section-tools button:hover { background: rgba(255,255,255,.2); }
    .sf-hidden-badge {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,.7);
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      z-index: 10;
    }

    /* ---- Section library items ---- */
    .lib-group-title {
      font-size: .7rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      margin: 16px 0 8px;
    }
    .lib-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px; cursor: grab;
      border: 1px solid transparent; transition: all .15s;
      margin-bottom: 4px;
      user-select: none;
    }
    .lib-item:hover { background: rgba(92,110,255,.08); border-color: rgba(92,110,255,.2); }
    .lib-item:active { cursor: grabbing; opacity: .7; }
    .lib-icon {
      width: 34px; height: 34px; border-radius: 9px;
      display: grid; place-items: center;
      background: rgba(92,110,255,.12); color: var(--primary); flex-shrink: 0;
    }
    .lib-icon svg { width: 16px; height: 16px; }
    .lib-label { font-weight: 600; font-size: .87rem; }
    .lib-desc { font-size: .75rem; color: var(--muted); margin-top: 1px; }

    /* ---- Template cards ---- */
    .tmpl-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      transition: all .2s;
      cursor: pointer;
    }
    .tmpl-card:hover { border-color: var(--primary); box-shadow: 0 6px 24px rgba(92,110,255,.15); }
    .tmpl-card.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(92,110,255,.2); }
    .tmpl-thumb {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .tmpl-body { padding: 12px 14px; }
    .tmpl-name { font-weight: 700; font-size: .9rem; }
    .tmpl-desc { font-size: .75rem; color: var(--muted); margin-top: 3px; }
    .tmpl-actions { display: flex; gap: 8px; margin-top: 10px; }
    .tmpl-actions .btn { flex: 1; font-size: .8rem; padding: 7px; }

    /* ---- Theme fields ---- */
    .theme-field { margin-bottom: 14px; }
    .theme-field label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    .theme-field .select, .theme-field .input { width: 100%; }
    .color-preview { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); }

    /* ---- Filter chips ---- */
    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      padding: 4px 12px; border-radius: 99px;
      border: 1.5px solid var(--border); background: transparent;
      font-size: .78rem; font-weight: 600; cursor: pointer;
      transition: all .15s; color: var(--muted);
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ---- Drop zone on canvas ---- */
    #builderCanvas.drop-active::after {
      content: "Drop here to add section";
      position: absolute;
      inset: 0;
      background: rgba(92,110,255,.06);
      border: 2px dashed var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--primary);
      z-index: 30;
      pointer-events: none;
    }

    /* ---- Responsive ---- */
    @media (max-width: 1100px) {
      .builder-shell { grid-template-columns: 280px 1fr; }
    }
    @media (max-width: 768px) {
      .builder-shell { grid-template-columns: 1fr; height: auto; }
      .builder-left { height: auto; max-height: 50vh; }
      .builder-canvas-wrap { padding: 12px; }
    }
  </style>
</head>
<body class="app-page no-splash">
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <main class="app-main" style="padding:0;overflow:hidden">
      <div id="topbarMount"></div>

      <!-- Builder header bar -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:12px">
        <div>
          <h1 style="font-size:1.1rem;margin:0">Store Builder</h1>
          <p class="muted" style="font-size:.8rem;margin:0">Drag sections · customize theme · publish</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn btn-ghost" id="undoBtn" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
          <button class="btn btn-ghost" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled>↷ Redo</button>
          <span style="width:1px;height:24px;background:var(--border)"></span>
          <select class="select" id="deviceSelect" style="width:auto;min-width:130px">
            <option value="desktop">💻 Desktop</option>
            <option value="tablet">📱 Tablet</option>
            <option value="mobile">📱 Mobile</option>
          </select>
          <button class="btn btn-ghost" id="previewBtn">🔍 Preview</button>
          <button class="btn btn-primary" id="publishBtn" style="min-width:100px">⚡ Publish</button>
        </div>
      </div>

      <!-- Main builder area -->
      <div class="builder-shell">

        <!-- LEFT: tabs + panels -->
        <div class="builder-left">
          <div class="builder-tabs" id="builderTabs">
            <button class="tab active" data-panel="sections">Sections</button>
            <button class="tab" data-panel="theme">Theme</button>
            <button class="tab" data-panel="templates">Templates</button>
            <button class="tab" data-panel="settings">Settings</button>
          </div>

          <!-- Sections panel -->
          <div class="builder-panel active" id="panelSections">
            <input class="input" type="search" placeholder="Search sections…" id="sectionSearch" style="margin-bottom:12px;width:100%">
            <div id="sectionLibrary"></div>
          </div>

          <!-- Theme panel -->
          <div class="builder-panel" id="panelTheme">
            <div class="theme-field">
              <label>Theme preset</label>
              <select class="select" id="themeSelect"></select>
            </div>
            <div class="theme-field">
              <label>Primary color</label>
              <input type="color" class="input" id="themePrimary" style="height:44px;padding:4px">
            </div>
            <div class="theme-field">
              <label>Font family</label>
              <select class="select" id="themeFont"></select>
            </div>
            <div class="theme-field">
              <label>Corner radius <span id="themeRadiusVal">16</span>px</label>
              <input type="range" id="themeRadius" min="0" max="28" value="16" style="width:100%">
            </div>
            <div class="theme-field">
              <label>Button style</label>
              <select class="select" id="themeButtonStyle">
                <option value="rounded">Rounded</option>
                <option value="pill">Pill</option>
                <option value="sharp">Sharp</option>
              </select>
            </div>
            <button class="btn btn-primary" style="width:100%;margin-top:4px" id="applyTheme">Apply Theme</button>
          </div>

          <!-- Templates panel -->
          <div class="builder-panel" id="panelTemplates">
            <input class="input" type="search" placeholder="Search templates…" id="tmplSearch" style="margin-bottom:10px;width:100%">
            <div class="filter-chips" id="tmplFilters"></div>
            <div id="tmplGrid"></div>
          </div>

          <!-- Settings panel -->
          <div class="builder-panel" id="panelSettings">
            <h4 style="margin-bottom:14px">Store info</h4>
            <div class="theme-field"><label>Store name</label><input class="input" id="storeNameInput" placeholder="My Awesome Store"></div>
            <div class="theme-field"><label>Tagline</label><input class="input" id="storeTaglineInput" placeholder="Beautiful products, fast delivery"></div>
            <div class="theme-field"><label>Logo (image file)</label><input class="input" type="file" accept="image/*" id="storeLogo"></div>
            <div class="theme-field"><label>Favicon (image file)</label><input class="input" type="file" accept="image/*" id="storeFavicon"></div>
            <div class="theme-field"><label>Social OG image</label><input class="input" type="file" accept="image/*" id="storeSocialImage"></div>
            <button class="btn btn-primary" style="width:100%;margin-bottom:20px" id="saveSettings">Save settings</button>

            <h4 style="margin-bottom:14px">SEO & Meta</h4>
            <div class="theme-field"><label>Meta title</label><input class="input" id="seoTitle" placeholder="Store name | Tagline"></div>
            <div class="theme-field"><label>Meta description</label><textarea class="textarea" id="seoDescription" rows="2" placeholder="Brief store description…"></textarea></div>
            <div class="theme-field"><label>Custom domain</label><input class="input" id="customDomain" placeholder="shop.yourdomain.com"></div>
            <button class="btn btn-primary" style="width:100%" id="saveSeo">Save SEO</button>
          </div>
        </div>

        <!-- RIGHT: canvas + editor -->
        <div class="builder-right">
          <div class="builder-canvas-wrap" id="canvasWrap">
            <div class="builder-device-frame" id="deviceFrame">
              <div class="builder-device-bar">
                <div class="builder-device-dots"><span></span><span></span><span></span></div>
                <div class="builder-device-url" id="deviceUrl">preview.dualcore.shop</div>
              </div>
              <div id="builderCanvas" 
                ondragover="event.preventDefault();this.classList.add('drop-active')"
                ondragleave="this.classList.remove('drop-active')"
                ondrop="window.__builderDrop(event)">
                <div class="canvas-empty" id="canvasEmpty">
                  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
                  <h3>Your store is empty</h3>
                  <p>Drag sections from the left panel or pick a template to start building</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Section editor -->
          <div class="builder-editor" id="sectionEditor">
            <div class="editor-head">
              <h4 id="editorTitle">Edit section</h4>
              <button class="btn-ghost" id="closeEditor" style="font-size:1.2rem;line-height:1;padding:4px 8px">×</button>
            </div>
            <div class="editor-fields" id="editorFields"></div>
            <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px">
              <p style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px">Section style</p>
              <div class="editor-fields" id="sectionStyleFields"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/storefront.js"></script>
  <script src="assets/js/builder.js"></script>
</body>
</html>
