<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — DualCore</title>
  <meta name="description" content="Manage your store products, inventory, variants and pricing.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C6EFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E">
</head>
<body class="app-page no-splash">
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <main class="app-main">
      <div id="topbarMount"></div>

      <div class="page-head">
        <div>
          <h1>Products</h1>
          <p class="muted" id="productCount">Loading…</p>
        </div>
        <div class="page-actions">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Search products…" id="productSearch" aria-label="Search products">
          </div>
          <button class="btn btn-ghost" id="exportBtn">⤓ Export CSV</button>
          <button class="btn btn-primary" id="addProductBtn">＋ Add product</button>
        </div>
      </div>

      <div class="filter-bar">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="active">Active</button>
        <button class="chip" data-filter="draft">Draft</button>
        <button class="chip" data-filter="low">Low stock</button>
        <button class="chip" data-filter="featured">Featured</button>
      </div>

      <div id="productView" class="product-grid"></div>

      <div id="productTableWrap" class="hidden" style="margin-top:8px">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th>Created</th><th></th></tr></thead>
            <tbody id="productTableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="productPagination"></div>
      </div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
