<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — DualCore</title>
  <meta name="description" content="Manage your customers, their activity and order history.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C6EFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E">
</head>
<body class="app-page no-splash">
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <main class="app-main">
      <div id="topbarMount"></div>

      <div class="page-head">
        <div>
          <h1>Customers</h1>
          <p class="muted" id="customerCount">Loading…</p>
        </div>
        <div class="page-actions">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Search customers…" id="customerSearch" aria-label="Search customers">
          </div>
          <button class="btn btn-ghost" id="exportCustomers">⤓ Export</button>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Customer</th><th>City</th><th>Orders</th><th>Total spent</th><th>Last active</th><th>Status</th><th></th></tr></thead>
            <tbody id="customersTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/customers.js"></script>
</body>
</html>
