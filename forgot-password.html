<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — DualCore</title>
  <meta name="description" content="Reset your DualCore account password.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235C6EFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h7l-1 8 10-12h-7l1-8z'/%3E%3C/svg%3E">
</head>
<body class="no-splash">
  <div class="auth-wrap">
    <div class="grid-overlay"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-3" style="opacity:.25"></div>

    <div class="auth-card">
      <div class="text-center" style="margin-bottom:24px">
        <a href="index.html" class="logo" style="justify-content:center">
          <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></span>
          <span>DualCore</span>
        </a>
      </div>

      <div class="card reveal visible" style="padding:36px">
        <div id="fpEmailStep">
          <h2 style="margin-bottom:6px">Forgot password?</h2>
          <p class="muted" style="margin-bottom:24px;font-size:.95rem">Enter your email and we'll send you a reset link.</p>
          <form id="fpForm" novalidate>
            <div class="field">
              <label for="fpEmail">Email</label>
              <input class="input" id="fpEmail" type="email" required placeholder="you@example.com" autocomplete="email">
            </div>
            <button class="btn btn-primary" type="submit" id="fpBtn" style="width:100%;padding:14px">Send reset link</button>
          </form>
        </div>

        <div id="fpDoneStep" class="hidden text-center" style="padding:16px 0">
          <div class="empty-icon" style="width:74px;height:74px;border-radius:24px;margin:0 auto 18px;background:rgba(0,200,150,.14);display:grid;place-items:center;color:var(--success)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:34px;height:34px"><path d="M4 4h16v16H4zM4 6l8 6 8-6"/></svg>
          </div>
          <h3 style="margin-bottom:8px">Check your inbox</h3>
          <p class="muted" style="font-size:.95rem">We've sent a password reset link to <b id="fpSentTo" style="color:var(--ink)"></b></p>
          <a href="login.html" class="btn btn-ghost" style="margin-top:20px">Back to login</a>
        </div>

        <p class="auth-footer-text">Remembered it? <a href="login.html" class="magic-link">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/forgot-password.js"></script>
</body>
</html>
